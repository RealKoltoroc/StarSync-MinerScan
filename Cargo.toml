[package]
name = "starsync-minerscan"
version = "0.6.8"
edition = "2024"
description = "StarSync MinerScan - lightweight Star Citizen scan signature monitor"
authors = ["StarSync MinerScan contributors"]
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.31", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
display-info = "0.5"
rfd = "0.15"
rodio = "0.20"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# xcap remains available as the GDI fallback. Live scanning primarily uses the
# persistent DXGI Desktop Duplication ROI path implemented in src/dxgi_capture.rs.
xcap = { version = "0.9.8", default-features = false }
ocrs = "0.13"
rten = "0.26"
image = "0.25"
ureq = "3"
base64 = "0.22"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tray-icon = "0.24.2"
global-hotkey = "0.7.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[build-dependencies]
winres = "0.1"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
